<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>15movie | دانلود فیلم و سریال</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0f0c1f 0%, #1a1a2e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #eee;
            padding: 20px;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        /* هدر */
        .header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 50px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        .header h1 {
            font-size: 3rem;
            background: linear-gradient(45deg, #ffd89b, #c7e9fb);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header p {
            color: #aaa;
            margin-top: 10px;
        }
        /* جستجو */
        .search-box {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        .search-box input {
            width: 80%;
            max-width: 400px;
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            background: #2a2a3e;
            color: white;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }
        .search-box input::placeholder {
            color: #888;
        }
        /* دسته‌بندی */
        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
        }
        .cat-btn {
            background: #2a2a3e;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            color: #ddd;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .cat-btn.active, .cat-btn:hover {
            background: #e67e22;
            color: white;
        }
        /* لیست فیلم‌ها */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        .movie-card {
            background: rgba(30,30,50,0.8);
            backdrop-filter: blur(5px);
            border-radius: 24px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .movie-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            border-color: #e67e22;
        }
        .movie-poster {
            width: 100%;
            height: 380px;
            object-fit: cover;
            background: #1e1e2a;
        }
        .movie-info {
            padding: 16px;
        }
        .movie-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffd966;
        }
        .movie-year {
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        .movie-genre {
            display: inline-block;
            background: #e67e22;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-top: 8px;
        }
        /* مودال (صفحه فیلم) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        .modal-content {
            max-width: 800px;
            margin: 30px auto;
            background: #1e1e2e;
            border-radius: 32px;
            padding: 25px;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 28px;
            cursor: pointer;
            background: #e67e22;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .modal-poster {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 24px;
            margin-bottom: 20px;
        }
        .download-btn {
            display: inline-block;
            background: #2ecc71;
            color: white;
            padding: 14px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.2s;
        }
        .download-btn:hover {
            background: #27ae60;
            transform: scale(1.02);
        }
        .actors {
            color: #bbb;
            margin: 15px 0;
            line-height: 1.6;
        }
        .footer {
            text-align: center;
            padding: 30px;
            color: #666;
            border-top: 1px solid #333;
            margin-top: 20px;
        }
        @media (max-width: 600px) {
            .header h1 { font-size: 2rem; }
            .movie-title { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎬 15movie</h1>
        <p>دانلود جدیدترین فیلم‌ها با کیفیت عالی | کانال تلگرام: @bestfilm12345</p>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="جستجوی فیلم، بازیگر یا ژانر ...">
    </div>

    <div class="categories">
        <button class="cat-btn active" data-cat="all">همه</button>
        <button class="cat-btn" data-cat="action">🔥 اکشن</button>
        <button class="cat-btn" data-cat="comedy">😂 کمدی</button>
        <button class="cat-btn" data-cat="scifi">🚀 علمی-تخیلی</button>
        <button class="cat-btn" data-cat="crime">🕵️ جنایی</button>
    </div>

    <div id="moviesGrid" class="movies-grid"></div>
    <div class="footer">
        © 2026 15movie - لینک دانلود از کانال تلگرام <strong>@bestfilm12345</strong>
    </div>
</div>

<!-- مودال جزئیات فیلم -->
<div id="movieModal" class="modal">
    <div class="modal-content">
        <div class="close-modal" id="closeModalBtn">✖</div>
        <img id="modalPoster" class="modal-poster" src="" alt="پوستر">
        <h2 id="modalTitle"></h2>
        <p><strong>سال:</strong> <span id="modalYear"></span> | <strong>ژانر:</strong> <span id="modalGenre"></span> | <strong>IMDb:</strong> <span id="modalImdb"></span></p>
        <div class="actors" id="modalActors"></div>
        <p id="modalPlot"></p>
        <a id="downloadLink" class="download-btn" href="#" target="_blank">🎬 دانلود از تلگرام →</a>
        <p style="margin-top: 12px; font-size: 12px; color: #aaa;">با کلیک وارد کانال تلگرام می‌شوید | لینک دانلود در کانال قرار دارد</p>
    </div>
</div>

<script>
    // دیتابیس فیلم‌ها (شامل 6 فیلم نمونه)
    const movies = [
        { id:1, title:"بیلشتراکس ۲", year:2025, genre:"action", genreFa:"اکشن", imdb:"8.7", poster:"https://via.placeholder.com/300x450/2c2c3a/ffaa44?text=Bill+Shart+2", actors:"جان سینا، دوین جانسون، جیسون موموآ", plot:"دومین قسمت از ماجراجویی‌های بیلشتراکس، یک مامور مخفی که باید جلوی فاجعه‌ای جهانی را بگیرد.", telegramLink:"https://t.me/bestfilm12345/1" },
        { id:2, title:"خنده در تاریکی", year:2024, genre:"comedy", genreFa:"کمدی", imdb:"7.2", poster:"https://via.placeholder.com/300x450/2c2c3a/aaffaa?text=Dark+Laugh", actors:"رامبد جوان، الناز حبیبی", plot:"داستان کمدی یک نویسنده که شب‌ها داستان ترسناک می‌نویسد اما اتفاقات خنده‌دار می‌افتد.", telegramLink:"https://t.me/bestfilm12345/2" },
        { id:3, title:"سایبر ۲۰۷۷", year:2026, genre:"scifi", genreFa:"علمی-تخیلی", imdb:"9.1", poster:"https://via.placeholder.com/300x450/2c2c3a/66ccff?text=Cyber+2077", actors:"کیانو ریوز، اسکارلت جوهانسون", plot:"سال ۲۰۷۷، هوش مصنوعی از کنترل خارج می‌شود و یک هکر باید جلوی انقراض انسان را بگیرد.", telegramLink:"https://t.me/bestfilm12345/3" },
        { id:4, title:"سقوط آزاد", year:2024, genre:"crime", genreFa:"جنایی", imdb:"8.0", poster:"https://via.placeholder.com/300x450/2c2c3a/ff8866?text=Free+Fall", actors:"نوید محمدزاده، پرویز پرستویی", plot:"یک پلیس سابق وارد دنیای زیرزمینی جرم و جنایت می‌شود تا انتقام بگیرد.", telegramLink:"https://t.me/bestfilm12345/4" },
        { id:5, title:"سرعت ۳", year:2025, genre:"action", genreFa:"اکشن", imdb:"8.3", poster:"https://via.placeholder.com/300x450/2c2c3a/ff5555?text=Speed+3", actors:"کریس همسورث، تام هاردی", plot:"یک اتوبوس بمب‌گذاری شده با سرعت بالای ۸۰ کیلومتر باید متوقف شود.", telegramLink:"https://t.me/bestfilm12345/5" },
        { id:6, title:"پیتزا و رفاقت", year:2026, genre:"comedy", genreFa:"کمدی", imdb:"7.0", poster:"https://via.placeholder.com/300x450/2c2c3a/f0f0aa?text=Pizza+Friends", actors:"مهران مدیری، جواد عزتی", plot:"چهار دوست قدیمی با باز کردن یک پیتزا فروشی وارد ماجراهای بامزه می‌شوند.", telegramLink:"https://t.me/bestfilm12345/6" }
    ];

    let currentGenre = "all";
    let searchText = "";

    function renderMovies() {
        let filtered = movies.filter(m => {
            if(currentGenre !== "all" && m.genre !== currentGenre) return false;
            if(searchText !== "") {
                const s = searchText.toLowerCase();
                return m.title.toLowerCase().includes(s) || m.actors.toLowerCase().includes(s) || m.genreFa.includes(s);
            }
            return true;
        });
        const grid = document.getElementById("moviesGrid");
        if(filtered.length === 0) {
            grid.innerHTML = `<div style="text-align:center;grid-column:1/-1;">🎬 فیلمی با این مشخصات پیدا نشد 🎬</div>`;
            return;
        }
        grid.innerHTML = filtered.map(movie => `
            <div class="movie-card" data-id="${movie.id}">
                <img class="movie-poster" src="${movie.poster}" alt="${movie.title}" onerror="this.src='https://via.placeholder.com/300x450/333/777?text=No+Poster'">
                <div class="movie-info">
                    <div class="movie-title">${movie.title}</div>
                    <div class="movie-year">سال ${movie.year} | IMDb: ${movie.imdb}</div>
                    <span class="movie-genre">${movie.genreFa}</span>
                </div>
            </div>
        `).join('');
        // رویداد کلیک روی کارت‌ها
        document.querySelectorAll('.movie-card').forEach(card => {
            card.addEventListener('click', (e) => {
                const id = parseInt(card.getAttribute('data-id'));
                openMovieModal(id);
            });
        });
    }

    function openMovieModal(id) {
        const movie = movies.find(m => m.id === id);
        if(!movie) return;
        document.getElementById("modalTitle").innerText = movie.title;
        document.getElementById("modalYear").innerText = movie.year;
        document.getElementById("modalGenre").innerText = movie.genreFa;
        document.getElementById("modalImdb").innerText = movie.imdb;
        document.getElementById("modalActors").innerHTML = `<strong>🎭 بازیگران:</strong> ${movie.actors}`;
        document.getElementById("modalPlot").innerHTML = `<strong>📖 خلاصه داستان:</strong> ${movie.plot}`;
        document.getElementById("modalPoster").src = movie.poster;
        const downloadA = document.getElementById("downloadLink");
        downloadA.href = movie.telegramLink;
        // اطمینان از اینکه لینک به کانال اصلی برسه
        if(!downloadA.href.includes("bestfilm12345")) {
            downloadA.href = `https://t.me/bestfilm12345/${movie.id}`;
        }
        document.getElementById("movieModal").style.display = "block";
        document.body.style.overflow = "hidden";
    }

    // بستن مودال
    function closeModal() {
        document.getElementById("movieModal").style.display = "none";
        document.body.style.overflow = "auto";
    }
    document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    window.addEventListener("click", (e) => {
        const modal = document.getElementById("movieModal");
        if(e.target === modal) closeModal();
    });

    // جستجو
    const searchInput = document.getElementById("searchInput");
    searchInput.addEventListener("input", (e) => {
        searchText = e.target.value.trim();
        renderMovies();
    });

    // دسته‌بندی
    const catBtns = document.querySelectorAll(".cat-btn");
    catBtns.forEach(btn => {
        btn.addEventListener("click", () => {
            catBtns.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentGenre = btn.getAttribute("data-cat");
            renderMovies();
        });
    });

    // بار اولیه
    renderMovies();
</script>
</body>
</html>
